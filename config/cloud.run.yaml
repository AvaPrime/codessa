# cloud.run.yaml - GCP Cloud Run Deployment Configuration
# This manifest defines how the Codessa system is deployed in the cloud.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: codessa-agent-service
  namespace: default
  annotations:
    autoscaling.knative.dev/maxScale: "10"
    run.googleapis.com/cloudsql-instances: ""
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/codessa-agent:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: codessa-secrets
                  key: api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codessa-secrets
                  key: database-url
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: "/health"
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/health"
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
